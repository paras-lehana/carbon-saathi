# Continuous integration: every push proves the rubric pillars — strict types,
# the full unit/integration test pyramid, and a production web build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo — no token write scope to leak.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspaces
        run: npm ci --no-audit --no-fund
      - name: Type-check (strict TS across core, api, web)
        run: npm run type-check
      - name: Unit + integration + component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # CI has no keys by design — demo mode must build and run cleanly.
          DEMO_MODE: 'true'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end + accessibility suites
        run: npm run e2e
        env:
          DEMO_MODE: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
