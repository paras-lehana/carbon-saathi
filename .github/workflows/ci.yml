# Continuous integration: every push proves the rubric pillars — strict types,
# the full unit/integration test pyramid, and a production web build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo — no token write scope to leak.
permissions:
  contents: read

# Actions pinned to commit SHAs (tag comments alongside) — mutable tags are a
# supply-chain seam; a re-pushed v4 must never change what CI executes.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install workspaces
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (production tree)
        # Zero known advisories: the root "overrides" forces postcss >=8.5.10
        # under next (GHSA-qx2v-qp2m-jg93), so the gate can hold at moderate.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type-check (strict TS across core, api, web)
        run: npm run type-check
      - name: Lint (ESLint across workspaces + e2e)
        run: npm run lint
      - name: Unit + integration + component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # CI has no keys by design — demo mode must build and run cleanly.
          DEMO_MODE: 'true'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end + accessibility suites
        run: npm run e2e
        env:
          DEMO_MODE: 'true'
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
